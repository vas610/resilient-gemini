[project]
name = "resilient-gemini"
version = "0.3.0"
description = "Plug-and-play retry (1, 2, 3... minute gaps), model fallback and opt-in Priority PayGo for Google ADK Gemini agents."
readme = "README.md"
requires-python = ">=3.10"
# google-adk is a peer dependency: the agent project that uses this library
# installs it. It is only in the dev group here, for local tests and examples.
dependencies = [
    "google-genai",
    "httpx",
]

[project.optional-dependencies]
# Optional: `pip install "resilient-gemini[adk]"` also installs a supported google-adk.
adk = ["google-adk>=1.36.0,<2"]

[dependency-groups]
dev = [
    "google-adk>=1.36.0,<2",
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_gemini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
