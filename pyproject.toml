[project]
name = "resilient-gemini"
version = "0.2.0"
description = "Plug-and-play retry (1, 2, 3... minute gaps), model fallback and opt-in Priority PayGo for Google ADK Gemini agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.39.1,<2",
    "google-genai",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_gemini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
